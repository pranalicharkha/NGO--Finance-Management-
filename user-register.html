<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>User Register - Nidigo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body data-page="user-register">

<div class="login-page">
  <div class="login-panel-left">
    <div class="lp-logo">
      <div class="lp-logo-icon"><i class="bi bi-bank2"></i></div>
      <span class="lp-logo-text">Nidigo</span>
    </div>
    <span class="lp-logo-sub">Finance Management System</span>
    <h2 class="lp-headline">Create Your<br/><em>Account</em><br/>Today.</h2>
    <p class="lp-desc">
      Register as a user to access donation history, transparency reports, and your dashboard.
    </p>
  </div>

  <div class="login-panel-right">
    <div class="login-form-wrap">
      <h2>User Registration</h2>
      <p class="subtitle">Create a new account.</p>

      <div class="alert-ngo" id="userRegisterError" style="display:none;"></div>

      <form id="userRegisterForm">
        <div class="form-group mb-3">
          <label class="form-label">Full Name</label>
          <input type="text" id="registerName" class="form-control" required>
        </div>

        <div class="form-group mb-3">
          <label class="form-label">Email Address</label>
          <input type="email" id="registerEmail" class="form-control" required>
        </div>

        <div class="form-group mb-4">
          <label class="form-label">Password</label>
          <input type="password" id="registerPassword" class="form-control" required>
        </div>

        <button type="submit" class="btn-primary-ngo">
          Register
        </button>
      </form>

      <div style="margin-top:20px;text-align:center;font-size:0.83rem;">
        <span style="color:var(--text-muted)">Already have an account? </span>
        <a href="user-login.html" style="color:var(--accent);font-weight:600">Login here</a>
      </div>
    </div>
  </div>
</div>

<script src="js/script.js?v=20260420a"></script>
</body>
</html>
