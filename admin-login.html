<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Admin Login — Nidigo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body data-page="admin-login">

<div class="login-page">

  <!-- LEFT: Branding Panel -->
  <div class="login-panel-left">
    <div class="lp-logo">
      <div class="lp-logo-icon"><i class="bi bi-bank2"></i></div>
      <span class="lp-logo-text">Nidigo</span>
    </div>
    <span class="lp-logo-sub">Finance Management System</span>

    <h2 class="lp-headline">Transparent.<br/><em>Accountable.</em><br/>Trusted.</h2>
    <p class="lp-desc">
      A professional finance management platform built for NGOs — track every rupee, build donor trust, and generate audit-ready reports.
    </p>
  </div>

  <!-- RIGHT: Login Form -->
  <div class="login-panel-right">
    <div class="login-form-wrap">

      <h2>Admin Sign In</h2>
      <p class="subtitle">Access the Nidigo admin dashboard.</p>

      <!-- Error message -->
      <div class="alert alert-danger" id="loginError" style="display:none;"></div>

      <form id="loginForm">
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input type="text" id="username" class="form-control" required>
        </div>

        <div class="mb-4">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-primary w-100">
          Sign In
        </button>
      </form>

      <div class="mt-3 text-center">
        Demo: admin / admin123
      </div>

    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- ========================= -->
<!-- Backend Login Connection -->
<!-- ========================= -->
<script>
window.addEventListener("DOMContentLoaded", function () {

    const form = document.getElementById("loginForm");

    form.addEventListener("submit", async function(e) {
        e.preventDefault();

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value.trim();
        const errorBox = document.getElementById("loginError");

        try {
            const response = await fetch("/admin/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ username, password })
            });

            const data = await response.json();
            console.log("Login response:", data);

            if (data.success) {
                // Save username from backend
                sessionStorage.setItem("adminUser", username);

                // Redirect to dashboard
                window.location.href = "/dashboard.html";
            } 
            else {
                errorBox.style.display = "block";
                errorBox.innerText = data.message || "Invalid username or password";
            }

        } catch (error) {
            console.error("Error:", error);
            errorBox.style.display = "block";
            errorBox.innerText = "Server not reachable. Please start backend.";
        }
    });

});
</script>

</body>
</html>
