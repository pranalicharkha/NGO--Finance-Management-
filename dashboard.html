<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Dashboard — Nidigo Finance</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
<link rel="stylesheet" href="css/style.css"/>

<style>

.topbar-user{
position:relative;
cursor:pointer;
display:flex;
align-items:center;
gap:8px;
}

.user-dropdown{
position:absolute;
top:45px;
right:0;
background:white;
border-radius:8px;
padding:10px;
width:160px;
display:none;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
z-index:100;
}

.user-dropdown button{
border:none;
background:none;
cursor:pointer;
width:100%;
text-align:left;
padding:6px;
}

.user-dropdown button:hover{
background:#f2f2f2;
}

</style>

</head>

<body data-page="dashboard">

<!-- SIDEBAR -->
<aside class="sidebar">

<div class="sidebar-brand">
<div class="brand-icon"><i class="bi bi-bank2"></i></div>
<div class="brand-text">
<p class="brand-name">Nidigo</p>
<span class="brand-sub">Finance System</span>
</div>
</div>

<nav class="sidebar-nav">

<div class="nav-section-label">Overview</div>

<a href="dashboard.html" class="nav-link active">
<i class="bi bi-grid-1x2"></i>
<span>Dashboard</span>
</a>

<div class="nav-section-label">Finance</div>

<a href="income.html" class="nav-link">
<i class="bi bi-arrow-down-circle"></i>
<span>Add Income</span>
</a>

<a href="expense.html" class="nav-link">
<i class="bi bi-arrow-up-circle"></i>
<span>Add Expense</span>
</a>

<div class="nav-section-label">Tools</div>

<a href="calendar.html" class="nav-link">
<i class="bi bi-calendar3"></i>
<span>Calendar</span>
</a>

<a href="reports.html" class="nav-link">
<i class="bi bi-file-earmark-bar-graph"></i>
<span>Reports</span>
</a>

</nav>

<div class="sidebar-footer">
<a href="#" class="nav-link btn-logout" onclick="logoutAdmin()">
<i class="bi bi-box-arrow-left"></i>
<span>Logout</span>
</a>
</div>

</aside>


<!-- TOPBAR -->

<header class="topbar">

<div class="topbar-title">Dashboard</div>

<div class="topbar-right">

<span class="topbar-date" id="topbarDate"></span>

<div class="topbar-user" id="userMenu">

<div class="avatar" id="adminAvatar">A</div>
<span class="user-name" id="adminName">Admin</span>

<div class="user-dropdown" id="userDropdown">

<p id="dropdownName" style="margin:0;font-weight:bold"></p>

<hr>

<button onclick="logoutAdmin()">
<i class="bi bi-box-arrow-right"></i> Logout
</button>

</div>

</div>

</div>

</header>


<!-- MAIN -->

<main class="main-content">

<div class="page-body">

<div class="page-header">
<h2>Financial Overview</h2>
<p>Live summary of Nidigo's income, expenses, and balance.</p>
</div>

<div class="row g-3 section-gap">

<div class="col-12 col-sm-6 col-xl-4">
<div class="stat-card income">
<div class="card-label">Total Income</div>
<div class="card-value" id="totalIncome">₹ 0</div>
</div>
</div>

<div class="col-12 col-sm-6 col-xl-4">
<div class="stat-card expense">
<div class="card-label">Total Expenses</div>
<div class="card-value" id="totalExpense">₹ 0</div>
</div>
</div>

<div class="col-12 col-sm-6 col-xl-4">
<div class="stat-card balance">
<div class="card-label">Available Balance</div>
<div class="card-value" id="totalBalance">₹ 0</div>
</div>
</div>

</div>

</div>

</main>


<script>

document.addEventListener("DOMContentLoaded", function(){

// Load dashboard data
async function loadDashboardData(){

try{

const response = await fetch("/admin/dashboard");
const data = await response.json();

document.getElementById("totalIncome").innerText = "₹ " + data.totalIncome;
document.getElementById("totalExpense").innerText = "₹ " + data.totalExpense;
document.getElementById("totalBalance").innerText = "₹ " + data.balance;

}catch(error){

console.error("Dashboard load error:", error);

}

}


// Load admin user
function loadAdminUser(){

const adminUser = sessionStorage.getItem("adminUser");

if(adminUser){

const name = adminUser.charAt(0).toUpperCase() + adminUser.slice(1);

document.getElementById("adminName").innerText = name;
document.getElementById("adminAvatar").innerText = name.charAt(0);
document.getElementById("dropdownName").innerText = name;

}else{

window.location.href = "/admin-login.html";

}

}


// Dropdown toggle
const userMenu = document.getElementById("userMenu");
const dropdown = document.getElementById("userDropdown");

if(userMenu && dropdown){

userMenu.addEventListener("click", function(){

dropdown.style.display =
dropdown.style.display === "block" ? "none" : "block";

});

}


// Logout
window.logoutAdmin = function(){

sessionStorage.removeItem("adminUser");
window.location.href = "/admin-login.html";

};


// Run
loadDashboardData();
loadAdminUser();

});

</script>

</body>
</html>
