<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Users - Nidigo Finance</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
<link rel="stylesheet" href="css/style.css"/>
<style>
/* Adjust users table styling */
.users-table-container {
    background: var(--bg-card);
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 4px 12px var(--shadow-color);
}
.users-table {
    width: 100%;
    border-collapse: collapse;
}
.users-table th, .users-table td {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border-color);
    text-align: left;
    color: var(--text-base);
}
.users-table th {
    font-weight: 600;
    color: var(--text-muted);
}
.btn-action {
    padding: 6px 12px;
    font-size: 0.85rem;
    border-radius: 6px;
    font-weight: 500;
}
.btn-edit {
    background: rgba(15, 110, 77, 0.1);
    color: var(--primary);
    border: none;
}
.btn-edit:hover {
    background: var(--primary);
    color: #fff;
}
.btn-delete {
    background: rgba(220, 38, 38, 0.1);
    color: var(--danger);
    border: none;
    margin-left: 8px;
}
.btn-delete:hover {
    background: var(--danger);
    color: #fff;
}
</style>
</head>
<body data-page="users">
<aside class="sidebar">
<div class="sidebar-brand">
<div class="brand-icon"><i class="bi bi-bank2"></i></div>
<div class="brand-text">
<p class="brand-name">Nidigo</p>
<span class="brand-sub">Finance System</span>
</div>
</div>
<nav class="sidebar-nav">
<div class="nav-section-label">Overview</div>
<a href="dashboard.html" class="nav-link"><i class="bi bi-grid-1x2"></i><span>Dashboard</span></a>
<div class="nav-section-label">Finance</div>
<a href="income.html" class="nav-link"><i class="bi bi-arrow-down-circle"></i><span>Add Income</span></a>
<a href="expense.html" class="nav-link"><i class="bi bi-arrow-up-circle"></i><span>Add Expense</span></a>
<div class="nav-section-label">Tools</div>
<a href="calendar.html" class="nav-link"><i class="bi bi-calendar3"></i><span>Calendar</span></a>
<a href="reports.html" class="nav-link"><i class="bi bi-file-earmark-bar-graph"></i><span>Reports</span></a>
<div class="nav-section-label">Management</div>
<a href="users.html" class="nav-link active"><i class="bi bi-people"></i><span>Users</span></a>
</nav>
<div class="sidebar-footer">
<a href="#" class="nav-link btn-logout" onclick="logoutAdmin()"><i class="bi bi-box-arrow-left"></i><span>Logout</span></a>
</div>
</aside>

<header class="topbar">
<div class="topbar-title">Manage Users</div>
<div class="topbar-right">
<span class="topbar-date" id="topbarDate"></span>
<button class="mode-toggle" title="Toggle theme"><i class="bi bi-moon-stars-fill"></i></button>
<div class="topbar-user" id="userMenu">
<div class="avatar" id="adminAvatar">A</div>
<span class="user-name" id="adminName">Admin</span>
<div class="user-dropdown" id="userDropdown">
<p id="dropdownName" style="margin:0;font-weight:bold"></p>
<hr>
<button onclick="logoutAdmin()"><i class="bi bi-box-arrow-right"></i> Logout</button>
</div>
</div>
</div>
</header>

<main class="main-content">
<div class="page-body">
<div class="page-header d-flex justify-content-between align-items-center">
<div>
    <h2>Users List</h2>
    <p>Manage all registered users and their details.</p>
</div>
<button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#userModal" onclick="openUserModal()">
    <i class="bi bi-person-plus"></i> Add New User
</button>
</div>

<div class="users-table-container section-gap">
    <table class="users-table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th style="min-width: 140px;">Actions</th>
            </tr>
        </thead>
        <tbody id="usersTbody">
            <tr><td colspan="4">Loading...</td></tr>
        </tbody>
    </table>
</div>

</div>
</main>

<!-- User Modal -->
<div class="modal fade" id="userModal" tabindex="-1" aria-labelledby="userModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="background:var(--bg-card);color:var(--text-base);border:1px solid var(--border-color);">
      <div class="modal-header" style="border-bottom:1px solid var(--border-color);">
        <h5 class="modal-title" id="userModalLabel">Add New User</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" style="filter:var(--invert-icon)"></button>
      </div>
      <form id="userForm">
        <div class="modal-body">
            <input type="hidden" id="userId" value=""/>
            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-control" id="userName" required style="background:var(--bg-base);color:var(--text-base);border:1px solid var(--border-color);">
            </div>
            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-control" id="userEmail" required style="background:var(--bg-base);color:var(--text-base);border:1px solid var(--border-color);">
            </div>
            <div class="mb-3">
                <label class="form-label">Password <small id="passwordHint" style="color:var(--text-muted);"></small></label>
                <input type="password" class="form-control" id="userPassword" style="background:var(--bg-base);color:var(--text-base);border:1px solid var(--border-color);">
            </div>
            <div id="userFormError" class="text-danger mb-2" style="display:none; font-size:0.9rem;"></div>
        </div>
        <div class="modal-footer" style="border-top:1px solid var(--border-color);">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="btnSaveUser">Save User</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
</body>
</html>
